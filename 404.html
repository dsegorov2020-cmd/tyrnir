<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🏆 Турнир</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<style>
  html,body{margin:0;height:100%;background:#5b0fb3;overflow:hidden;font-family:system-ui,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  .nf{color:#fff;text-align:center;padding:60px 20px;font-size:20px}
  .nf a{color:#ffd23f;font-weight:700}
</style>
</head>
<body>
<script>
  // Любой адрес вида /tyrnir-17-11-2026 открывает созданный турнир
  var EXEC = "https://script.google.com/macros/s/AKfycbwyY5ndFXHC8v3JwyArlJXj_LgF10CIY5P91Wabc7gTKqBATdmZSujqPGi79h4heHHQyQ/exec";
  var id = decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g, "").toLowerCase();
  if (/^tyrnir-[a-z0-9-]{1,50}$/.test(id)) {
    document.title = "🏆 Турнир";
    var f = document.createElement("iframe");
    f.src = EXEC + "?id=" + encodeURIComponent(id);
    f.title = "Турнир";
    f.setAttribute("allow", "clipboard-write");
    document.body.appendChild(f);
  } else {
    document.body.innerHTML = '<div class="nf">Такой страницы нет 🤷<br><br><a href="/">← На главную турнира</a></div>';
  }
</script>
</body>
</html>
